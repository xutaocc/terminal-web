# psmux configuration for terminal-web on Windows
# Loaded via: tmux.exe -f <repo>/tmux/web.psmux.conf ... (and PSMUX_CONFIG_FILE,
# see src/tmux.ts). psmux (https://github.com/psmux/psmux) is a native Windows
# tmux; it reads tmux syntax, so this mirrors web.tmux.conf and only differs
# where psmux does. Read web.tmux.conf for why each setting is what it is.

# --- Shell ---------------------------------------------------------------------
# PowerShell 7. psmux's own default is $SHELL when usable, which is Git Bash
# when the server was started from a Git Bash window: MSYS line editing under
# ConPTY garbles multibyte (CJK) input, and its /c/... paths disagree with the
# C:\... ones every pane reports. TERMINAL_WEB_SHELL overrides this (src/tmux.ts).
set -g default-shell "C:/Program Files/PowerShell/7/pwsh.exe"

# --- Mouse & scrolling -----------------------------------------------------------
set -g mouse on
set -g history-limit 100000

# --- Window sizing / latency -----------------------------------------------------
set -g window-size latest
set -sg escape-time 25

# --- Terminal type ---------------------------------------------------------------
# NOT tmux-256color: psmux's compatibility notes say that value misplaces the
# cursor (a line feed becomes CR LF). xterm-256color is what xterm.js is.
set -g default-terminal "xterm-256color"
set -s set-clipboard on

# --- Appearance ------------------------------------------------------------------
set -g status off

# psmux's pre-spawned ("warm") servers start before this file is read, and a
# session claimed from one keeps psmux's defaults — the green status bar
# included. terminal-web turns the pool off (PSMUX_NO_WARM), and this says so too.
set -g warm off
